<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vitrina - Smart Mobile Accessories Store">
    <title>Vitrina | Smart E-Commerce Store</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="container nav">
        <a href="#/" class="logo">
            <span>V</span>
            Vitrina
        </a>

        <nav class="desktop-nav">
            <a href="#/">Home</a>
            <a href="#/shop">Shop</a>
            <a href="#/wishlist">Wishlist</a>
        </nav>

        <div class="nav-actions">
            <button class="icon-btn" id="wishlistBtn" aria-label="Wishlist">
                ♡
                <span class="badge" id="wishlistCount">0</span>
            </button>

            <button class="icon-btn" id="cartBtn" aria-label="Cart">
                🛒
                <span class="badge" id="cartCount">0</span>
            </button>

            <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        </div>
    </div>

    <div class="mobile-menu" id="mobileMenu">
        <a href="#/">Home</a>
        <a href="#/shop">Shop</a>
        <a href="#/wishlist">Wishlist</a>
    </div>
</header>

<main id="app"></main>

<div class="cart-overlay" id="cartOverlay"></div>

<aside class="cart-drawer" id="cartDrawer">
    <div class="drawer-header">
        <div>
            <span class="eyebrow">YOUR BAG</span>
            <h2>Shopping Cart</h2>
        </div>

        <button class="close-btn" id="closeCart">×</button>
    </div>

    <div class="cart-content" id="cartContent"></div>

    <div class="cart-footer" id="cartFooter"></div>
</aside>

<div class="toast-container" id="toastContainer"></div>

<script src="app.js"></script>

</body>
</html>
